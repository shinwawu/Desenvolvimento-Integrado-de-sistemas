[package]
name = "Desenvolvimento-Integrado-de-sistemas"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
poem = "3.1.12"
sprs = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
bytes = "1"
num_cpus = "1"
zip = "2"
chrono = "0.4"
sysinfo = "0.32"
rayon = "1.10"
faer = "0.22"
# ryu/itoa: float/int → ASCII rapidos (ryu ~2-3x mais rapido que dtoa). usados
# no response builder manual que evita Vec<Vec<f32>> + serde_json::Value.
ryu = "1.0"
itoa = "1.0"
# mimalloc: allocator paralelo, arena-aware. Substitui o allocator default do
# Windows (lento sob alta concorrencia). 5-15% de melhoria observada tipicamente.
mimalloc = { version = "0.1", default-features = false }
# reqwest: cliente HTTP usado pelo proxy para encaminhar requests aos workers.
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true